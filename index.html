<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="./estilos/form.css">
    <link rel="shortcut icon" href="./imagens/maomao-ico.ico" type="image/x-icon">
    <title>Entrar para  o presente</title>
</head>
<body>
    

    <main class="container">

        <form id="form-login">
            <h1>Login</h1>

            <div class="input-box">
                <input type="text"     id="nome" placeholder="digite Numa" required>
                <i class="bx bxs-user"></i>

            </div>


            <div class="input-box" >
                <input type="password" id="senha" placeholder="senha" required>
                 <i class="bx bxs-lock-alt"></i>
            </div>

            <p id="mensagem-erro" class="mensagem-erro"></p>


            <button type="submit" class="login">Login</button>


        </form>
    </main>


    <script src="./script.js"></script>

    <footer>
        
        <span>Desenvolvido por <span class="denji">Denji</span> com amor para Numa ❤️ </span>
        <img src="./imagens/giphy.gif" alt="" class="imagem">
    </footer>
</body>
</html>
